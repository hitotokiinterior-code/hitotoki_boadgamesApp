<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2人対戦ゲームコレクション</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Jost:wght@500;600;700&display=swap');

  :root{
    --hairline: rgba(255,255,255,0.14);
    --silver: #cfcfcf;
    --silver-dim: #6f6f6f;
    --nav-h: 72px;
  }

  *{ box-sizing:border-box; }

  html{
    touch-action: none; /* ピンチズーム・縦スワイプを禁止 */
    overscroll-behavior: none;
  }

  body{
    margin:0;
    min-height:100vh;
    height:100vh;
    overflow:hidden;
    touch-action: none; /* ピンチズーム・縦スワイプを禁止 */
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    background:
      radial-gradient(ellipse at 50% -10%, #1c1c1c 0%, #0a0a0a 55%, #000000 100%);
    font-family:'Zen Kaku Gothic New', sans-serif;
    color: var(--silver);
    display:flex;
    justify-content:center;
    padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }

.app{
  width:100%;
  max-width:460px;
  display:none;
  flex-direction:column;
  align-items:center;
  gap:28px;
  padding-bottom: calc(var(--nav-h) + 14px);
}

  /* --- 切り替わる画面（ホーム／記録／コレクション） --- */
  .view-content{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }
  .view-placeholder{
    width:100%;
    min-height: 240px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-align:center;
    color: var(--silver-dim);
  }
  .view-placeholder .icon{
    font-size:1.8rem;
    opacity:0.7;
    margin-bottom:4px;
  }
  .view-placeholder .title{
    font-family:'Kaisei Decol', serif;
    font-size:1rem;
    letter-spacing:0.06em;
    color:#fff;
  }
  .view-placeholder .desc{
    font-size:0.72rem;
    letter-spacing:0.04em;
    line-height:1.7;
    max-width:260px;
  }

  /* --- 下部ナビゲーションバー --- */
  .bottom-nav{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:600;
    display:flex;
    height: calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: linear-gradient(180deg, rgba(10,10,10,0.55), rgba(0,0,0,0.94) 45%);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--hairline);
  }
  .nav-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    border:none;
    padding:6px 4px;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-icon-img{
    height: 100%;
    max-height: 46px;
    width:auto;
    object-fit: contain;
    opacity:0.55;
    filter: grayscale(35%);
    transition: opacity .15s ease, filter .15s ease, transform .15s ease;
  }
  .nav-btn.active .nav-icon-img{
    opacity:1;
    filter: grayscale(0%);
    transform: translateY(-1px) scale(1.04);
  }

  header{ text-align:center; }
  h1{
    font-family:'Kaisei Decol', serif;
    font-weight:700;
    font-size: clamp(1.5rem, 6vw, 1.9rem);
    letter-spacing: 0.08em;
    margin:0;
    margin-top:35px;
    color:#fff;
    text-shadow: 0 2px 10px rgba(255,255,255,0.12);
  }
  h1 .small{
    display:block;
    font-size:0.58rem;
    letter-spacing:0.4em;
    font-weight:500;
    color:var(--silver-dim);
    margin-top:10px;
    text-transform: uppercase;
  }

  /* --- swipeable pages: 3枚のカードを縦に並べ、上下スワイプでページ送り --- */
  .game-grid{
    --card-h: 108px;
    --card-gap: 10px;
    width:100%;
    height: calc(var(--card-h) * 3 + var(--card-gap) * 2);
    display:flex;
    flex-direction:column;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
    touch-action: pan-y; /* このエリアだけ縦スワイプを許可 */
  }

  .game-grid::-webkit-scrollbar{
    display:none;
  }

  /* 1ページ = カード3枚ぶんの高さ。中を1列×3行で並べる */
  .game-page{
    flex: 0 0 100%;
    height:100%;
    scroll-snap-align: start;
    display:flex;
    flex-direction:column;
    gap: var(--card-gap);
    padding: 2px 4px;
  }


  .game-card{
    position:relative;
    flex: 0 0 var(--card-h);
    height: var(--card-h);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:8px;
    padding: 12px 12px 10px;
    background: linear-gradient(160deg, #202020, #101010 55%, #030303);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    text-decoration:none;
    color:#fff;
    box-shadow: 0 6px 14px rgba(0,0,0,0.4);
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .game-card:hover{
    transform: translateY(-3px);
    border-color: var(--silver-dim);
    box-shadow: 0 10px 20px rgba(0,0,0,0.55);
  }
  .game-card .num{
    font-family:'Jost', sans-serif;
    font-weight:600;
    font-size:0.68rem;
    color: var(--silver-dim);
    letter-spacing:0.05em;
  }
  .game-card .title{
    font-family:'Kaisei Decol', serif;
    font-size: 0.92rem;
    letter-spacing: 0.03em;
    line-height:1.3;
  }
  .game-card .tags{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
  }
  .game-card .tag{
    font-size:0.56rem;
    letter-spacing:0.04em;
    color: var(--silver-dim);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 2px 7px;
  }
  .game-card .tag.cpu{ color:#dcd6c0; border-color: rgba(220,214,192,0.35); }
  .game-card .tag.master{ color:#fff; border-color: rgba(255,255,255,0.5); }

  /* ページ位置を示すインジケーター（丸ではなく細いバー） */
  /* ページ位置を示すドット */
  .page-dots{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:4px;
  }
  .page-dots .dot{
    width:6px; height:6px;
    border-radius:50%;
    background: var(--hairline);
    transition: background .15s ease, transform .15s ease;
  }
  .page-dots .dot.active{
    background:#fff;
    transform: scale(1.2);
  }

  footer{
    font-size:0.68rem;
    color: var(--silver-dim);
    letter-spacing:0.06em;
    text-align:center;
  }
#opening{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  background:#000;
  z-index:9999;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

#openingVideo{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* --- tap to start screen (OP動画の後に表示) --- */
#startScreen{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  background:#000;
  z-index:10000;
  display:none;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}
#startScreen .tap-text{
  font-family:'Kaisei Decol', serif;
  font-weight:500;
  color:#fff;
  font-size: clamp(0.9rem, 4.5vw, 1.15rem);
  letter-spacing:0.35em;
  text-transform:uppercase;
  animation: tapBlink 1.8s ease-in-out infinite;
  transform: translateY(-15vh);
}
@keyframes tapBlink{
  0%, 100%{ opacity:1; }
  50%{ opacity:0.2; }
}

  /* --- bonus tools --- */
  .extras{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .extras-heading{
    font-size:0.62rem;
    letter-spacing:0.3em;
    color: var(--silver-dim);
    text-transform:uppercase;
    text-align:center;
    margin-bottom: 2px;
  }
  .icon-toggle-row{
    display:flex;
    gap:12px;
    justify-content:center;
  }
  .tool-toggle{
    display:flex;
    align-items:center;
    justify-content:center;
    width: 56px;
    height: 56px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    font-size:1.4rem;
    cursor:pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .tool-toggle:hover{ background: rgba(255,255,255,0.07); border-color: var(--silver-dim); }
  .tool-toggle.open{ background:#fff; border-color:#fff; }

  .tool-panel{
    width:100%;
    background: linear-gradient(160deg, #202020, #141414 45%, #030303);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 20px 18px;
    display:none;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .tool-panel.open{ display:flex; }

  .count-row{ display:flex; gap:8px; }
  .count-btn{
    width:36px; height:36px;
    border-radius:50%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--silver-dim);
    color: var(--silver);
    font-family:'Jost', sans-serif;
    font-weight:600;
    font-size:0.85rem;
    cursor:pointer;
    transition: all .15s ease;
  }
  .count-btn.active{ background:#fff; color:#141414; border-color:#fff; }

  .dice-row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; min-height:58px; }
  .die{
    width: 52px; height: 52px;
    background: linear-gradient(180deg, #ffffff, #cfc9b8);
    border-radius: 9px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.35), 0 6px 10px rgba(0,0,0,0.45), inset 0 2px 2px rgba(255,255,255,0.8);
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 7px;
  }
  .die.rolling{ animation: tumble 0.5s ease; }
  @keyframes tumble{
    0%{ transform: rotate(0deg) scale(1); }
    30%{ transform: rotate(120deg) scale(1.08); }
    60%{ transform: rotate(240deg) scale(0.94); }
    100%{ transform: rotate(360deg) scale(1); }
  }
  .pip{ width:7px; height:7px; border-radius:50%; background:#17130c; justify-self:center; align-self:center; opacity:0; }
  .pip.on{ opacity:1; }

  .dice-sum{ font-family:'Jost', sans-serif; font-size:0.78rem; color: var(--silver-dim); }
  .dice-sum b{ color:#fff; font-size:1rem; }

  .coin-wrap{ perspective: 600px; }
  .coin{
    width:84px; height:84px;
    border-radius:50%;
    position:relative;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.2,.8,.3,1);
  }
  .coin-face{
    position:absolute; inset:0;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Kaisei Decol', serif;
    font-weight:700;
    font-size:1.1rem;
    backface-visibility: hidden;
  }
  .coin-face.heads{
    background: linear-gradient(180deg, #ffffff, #cfc9b8);
    color:#141414;
    box-shadow: 0 4px 0 rgba(0,0,0,0.35), 0 8px 14px rgba(0,0,0,0.45), inset 0 2px 2px rgba(255,255,255,0.8);
  }
  .coin-face.tails{
    background: linear-gradient(180deg, #4a4a4a, #000000);
    color:#f2efe6;
    transform: rotateY(180deg);
    box-shadow: 0 4px 0 rgba(0,0,0,0.5), 0 8px 14px rgba(0,0,0,0.5), inset 0 0 0 1px #6f6f6f;
  }

  .coin-result{ font-size:0.8rem; color:#fff; letter-spacing:0.06em; min-height:1.2em; }

  .tool-btn{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:0.78rem;
    letter-spacing:0.1em;
    color:#fff;
    background: transparent;
    border: 1px solid var(--silver-dim);
    border-radius:2px;
    padding: 11px 26px;
    cursor:pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .tool-btn:hover{ background: rgba(255,255,255,0.06); border-color:#fff; }
  .tool-btn:active{ transform: translateY(1px); }
  header{
  position:relative;
  width:100%;
  text-align:center;
}


.setting-btn{

  position:absolute;

  right:0;
  top:0;

  width:42px;
  height:42px;

  background:rgba(255,255,255,0.05);

  border:1px solid var(--hairline);

  border-radius:8px;

  color:#fff;

  font-size:1.4rem;

  cursor:pointer;

}
/* 設定パネル */

.setting-panel{

  position:fixed;

  top:0;
  right:-80%;

  width:80%;
  height:100%;

  background:rgba(10,10,10,0.65);

  backdrop-filter:blur(12px);

  z-index:999;

  padding:40px 25px;

  transition:0.35s ease;

}

.setting-panel.open{

  right:0;

}


.setting-panel h2{

  margin:0;

  color:#fff;

  font-family:'Kaisei Decol', serif;

  font-size:1.5rem;

}

.setting-panel .close-btn{
  position:absolute;
  top:20px;
  right:20px;
  width:32px;
  height:32px;
  background:transparent;
  border:1px solid var(--hairline);
  border-radius:50%;
  color:#fff;
  font-size:1.1rem;
  line-height:1;
  cursor:pointer;
}

.setting-menu{
  display:flex;
  flex-direction:column;
  margin-top:28px;
  width:100%;
}
.setting-menu-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 4px;
  border-bottom:1px solid var(--hairline);
  color:#fff;
  text-decoration:none;
  font-family:'Zen Kaku Gothic New', sans-serif;
  font-size:0.82rem;
  letter-spacing:0.04em;
  transition: color .15s ease;
}
.setting-menu-item:hover{
  color: var(--silver-dim);
}
.setting-menu-item .arrow{
  color: var(--silver-dim);
  font-size:0.9rem;
}


</style>
</head>
<body>

<div class="app">
  
 <header>

<script>
(function(){
  // ピンチズームの保険（Safari対策）
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  document.addEventListener('touchmove', e => {
    if(e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  const PIP_PATTERNS = {
    1: [5], 2: [1,9], 3: [1,5,9], 4: [1,3,7,9], 5: [1,3,5,7,9], 6: [1,3,4,6,7,9],
  };

  function setupToggle(toggleId, panelId, otherToggleId, otherPanelId){
    const toggle = document.getElementById(toggleId);
    const panel = document.getElementById(panelId);
    const otherToggle = document.getElementById(otherToggleId);
    const otherPanel = document.getElementById(otherPanelId);
    toggle.addEventListener('click', () => {
      const willOpen = !panel.classList.contains('open');
      panel.classList.toggle('open', willOpen);
      toggle.classList.toggle('open', willOpen);
      if(willOpen){
        otherPanel.classList.remove('open');
        otherToggle.classList.remove('open');
      }
    });
  }
  setupToggle('diceToggle', 'dicePanel', 'coinToggle', 'coinPanel');
  setupToggle('coinToggle', 'coinPanel', 'diceToggle', 'dicePanel');

  // --- dice roller ---
  let diceCount = 2;
  let diceRolling = false;

  function renderDiceCountButtons(){
    const row = document.getElementById('diceCountRow');
    row.innerHTML = '';
    for(let n=1; n<=5; n++){
      const btn = document.createElement('button');
      btn.className = 'count-btn' + (n === diceCount ? ' active' : '');
      btn.textContent = n;
      btn.addEventListener('click', () => {
        diceCount = n;
        renderDiceCountButtons();
        renderDiceFaces(Array(diceCount).fill(0));
      });
      row.appendChild(btn);
    }
  }

  function renderDiceFaces(values){
    const row = document.getElementById('diceRow');
    row.innerHTML = '';
    values.forEach(v => {
      const die = document.createElement('div');
      die.className = 'die';
      for(let i=1;i<=9;i++){
        const p = document.createElement('div');
        p.className = 'pip';
        if((PIP_PATTERNS[v] || []).includes(i)) p.classList.add('on');
        die.appendChild(p);
      }
      row.appendChild(die);
    });
    const sumEl = document.getElementById('diceSum');
    const total = values.reduce((a,b) => a+b, 0);
    sumEl.innerHTML = values.some(v => v > 0) ? ('合計 <b>' + total + '</b>') : '';
  }

  document.getElementById('diceRollBtn').addEventListener('click', () => {
    if(diceRolling) return;
    diceRolling = true;
    document.getElementById('diceRollBtn').disabled = true;

    let flickers = 0;
    const iv = setInterval(() => {
      const randomValues = Array.from({length:diceCount}, () => Math.floor(Math.random()*6)+1);
      renderDiceFaces(randomValues);
      document.querySelectorAll('#diceRow .die').forEach(d => {
        d.classList.remove('rolling'); void d.offsetWidth; d.classList.add('rolling');
      });
      flickers++;
      if(flickers > 5){
        clearInterval(iv);
        diceRolling = false;
        document.getElementById('diceRollBtn').disabled = false;
      }
    }, 90);
  });

  renderDiceCountButtons();
  renderDiceFaces(Array(diceCount).fill(0));

  // --- coin flip ---
  let coinFlipping = false;
  let coinRotation = 0;

  document.getElementById('coinFlipBtn').addEventListener('click', () => {
    if(coinFlipping) return;
    coinFlipping = true;
    document.getElementById('coinFlipBtn').disabled = true;
    document.getElementById('coinResult').textContent = '';

    const isHeads = Math.random() < 0.5;
    const extraSpins = 4;
    coinRotation += extraSpins * 360 + (isHeads ? 0 : 180);
    const coin = document.getElementById('coin');
    coin.style.transform = 'rotateY(' + coinRotation + 'deg)';

    setTimeout(() => {
      document.getElementById('coinResult').textContent = isHeads ? '表が出ました' : '裏が出ました';
      coinFlipping = false;
      document.getElementById('coinFlipBtn').disabled = false;
    }, 1000);
});

  // --- ゲーム一覧データ（縦=1ページ6枚でページ送り／横=全カードを1本の帯で横スクロール） ---
  const GAMES = [
    { num:'01', title:'ミニ将棋', href:'mini_shogi.html', tags:[{t:'2人'},{t:'CPU',c:'cpu'},{t:'達人',c:'master'}] },
    { num:'02', title:'コネクトフォー', href:'connect_four.html', tags:[{t:'2人'},{t:'CPU',c:'cpu'},{t:'達人',c:'master'}] },
    { num:'03', title:'神経衰弱', href:'memory_match.html', tags:[{t:'2人'},{t:'CPU',c:'cpu'}] },
    { num:'04', title:'ヒット＆ブロー', href:'hit_and_blow.html', tags:[{t:'2人'},{t:'CPU',c:'cpu'},{t:'達人',c:'master'}] },
    { num:'05', title:'ドット＆ボックス', href:'dots_and_boxes.html', tags:[{t:'2人'}] },
    { num:'06', title:'五目並べ', href:'gomoku.html', tags:[{t:'2人'},{t:'CPU',c:'cpu'},{t:'達人',c:'master'}] },
    { num:'07', title:'積み木カウント', href:'counting_duel.html', tags:[{t:'2人'}] },
    { num:'08', title:'ダイス21', href:'dice21.html', tags:[{t:'2人'},{t:'CPU',c:'cpu'}] },
    { num:'09', title:'ダウト', href:'doubt_game.html', tags:[{t:'2人'},{t:'CPU',c:'cpu'}] },
    { num:'10', title:'ブラックジャック', href:'blackjack.html', tags:[{t:'ディーラー戦',c:'cpu'}] },
    { num:'11', title:'2人人狼', href:'werewolf2.html', tags:[{t:'2人'}] },
  ];

  const gameGrid = document.getElementById('gameGrid');
  const dotsWrap = document.getElementById('pageDots');

  function buildCardEl(game){
    const a = document.createElement('a');
    a.className = 'game-card';
    a.href = game.href;

    const info = document.createElement('div');
    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = game.num;
    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = game.title;
    info.appendChild(num);
    info.appendChild(title);

    const tagsWrap = document.createElement('div');
    tagsWrap.className = 'tags';
    game.tags.forEach(tag => {
      const span = document.createElement('span');
      span.className = 'tag' + (tag.c ? ' ' + tag.c : '');
      span.textContent = tag.t;
      tagsWrap.appendChild(span);
    });

    a.appendChild(info);
    a.appendChild(tagsWrap);
    return a;
  }

  function renderGamePages(){
    gameGrid.innerHTML = '';

    // 1ページ3枚を縦に並べ、ページ単位で上下スワイプする
    const perPage = 3;
    const totalPages = Math.ceil(GAMES.length / perPage);
    for(let p = 0; p < totalPages; p++){
      const pageEl = document.createElement('div');
      pageEl.className = 'game-page';
      GAMES.slice(p * perPage, p * perPage + perPage).forEach(game => {
        pageEl.appendChild(buildCardEl(game));
      });
      gameGrid.appendChild(pageEl);
    }
    renderDots(totalPages);
    gameGrid.scrollTop = 0;
  }

  function renderDots(count){
    dotsWrap.innerHTML = '';
    for(let i = 0; i < count; i++){
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dotsWrap.appendChild(dot);
    }
  }

  function updateActiveDot(){
    const pageHeight = gameGrid.clientHeight;
    if(!pageHeight) return;
    const idx = Math.round(gameGrid.scrollTop / pageHeight);
    dotsWrap.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));
  }

  gameGrid.addEventListener('scroll', () => {
    window.requestAnimationFrame(updateActiveDot);
  }, { passive: true });

  renderGamePages();

    const opening = document.getElementById("opening");
  const openingVideo = document.getElementById("openingVideo");
  const startScreen = document.getElementById("startScreen");

  opening.style.display = "none";
  startScreen.style.display = "none";

}
  
 function showStartScreen(){
  sessionStorage.setItem("hitotokiStarted", "true");

  opening.style.display = "none";
  startScreen.style.display = "flex";
}

  openingVideo.addEventListener("ended", showStartScreen);

  opening.addEventListener("click", () => {
    openingVideo.pause();
    showStartScreen();
  });

  startScreen.addEventListener("click", () => {
    startScreen.style.display = "none";
    app.style.display = "flex";
  });

// --- 下部ナビ：ホーム／記録／コレクションの画面切り替え ---
const navButtons = document.querySelectorAll('.nav-btn');
const views = document.querySelectorAll('.view-content');

function switchView(viewId){
  views.forEach(v => { v.style.display = (v.id === viewId) ? 'flex' : 'none'; });
  navButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.view === viewId));
  if(viewId === 'homeView'){
    // ホームに戻ったときはページ位置を再計算しておく（回転などでズレる場合があるため）
    renderGamePages();
  }
}

navButtons.forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.dataset.view));
});
})();
