<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2人対戦ゲームコレクション</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Jost:wght@500;600;700&display=swap');

  :root{
    --hairline: rgba(255,255,255,0.14);
    --silver: #cfcfcf;
    --silver-dim: #6f6f6f;
    --nav-h: 60px;
  }

  *{ box-sizing:border-box; }

  html{
    touch-action: none; /* ピンチズーム・縦スワイプを禁止 */
    overscroll-behavior: none;
  }

  body{
    margin:0;
    min-height:100vh;
    height:100vh;
    overflow:hidden;
    touch-action: none; /* ピンチズーム・縦スワイプを禁止 */
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    background:
      radial-gradient(ellipse at 50% -10%, #1c1c1c 0%, #0a0a0a 55%, #000000 100%);
    font-family:'Zen Kaku Gothic New', sans-serif;
    color: var(--silver);
    display:flex;
    justify-content:center;
    padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }

.app{
  width:100%;
  max-width:460px;
  display:none;
  flex-direction:column;
  align-items:center;
  gap:28px;
  padding-bottom: calc(var(--nav-h) + 14px);
}

  /* --- 切り替わる画面（ホーム／記録／コレクション） --- */
  .view-content{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
    margin-top:-14px;
  }

  /* --- タイマー：発車標風。カードを左右半分に分け、右半分は常に「現在の設定
     ／カウントダウン」を表示。左半分は普段カバーで隠れている設定画面（プリセット・±）。
     カバーは常にどちらか半分だけを覆うトグル式で、右へずらすと設定側が開き、
     左へ戻す（設定側を再び覆う）と、その瞬間にタイマーがスタートする --- */
  .timer-card{
    position:relative;
    width:100%;
    height:96px;
    border-radius:10px;
    overflow:hidden;
    border: 1px solid var(--hairline);
    background: linear-gradient(160deg, #1c1c1c, #0a0a0a 60%, #020202);
    box-shadow: 0 6px 14px rgba(0,0,0,0.4);
  }

  /* 左半分：設定画面（プリセット・±）。普段はカバーの下に隠れている */
  .timer-settings{
    position:absolute;
    left:0; top:0; bottom:0;
    width:50%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding: 0 14px;
  }
  .timer-presets{
    display:flex;
    gap:8px;
  }
  .preset-btn{
    padding:8px 18px;
    border-radius:6px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--silver-dim);
    color: var(--silver);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:0.7rem;
    letter-spacing:0.01em;
    cursor:pointer;
    transition: all .15s ease;
  }
  .preset-btn.active{
    background:#fff;
    color:#141414;
    border-color:#fff;
  }
  .timer-stepper{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .step-btn{
    width:29px; height:29px;
    flex: 0 0 29px;
    border-radius:50%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--silver-dim);
    color: var(--silver);
    font-family:'Jost', sans-serif;
    font-size:1rem;
    line-height:1;
    cursor:pointer;
    transition: all .15s ease;
  }
  .step-btn:active{ background:#fff; color:#141414; border-color:#fff; }
  .step-btn.reset-btn{
    font-size:0.82rem;
    color: var(--silver-dim);
  }
  .step-value{
    min-width:36px;
    text-align:center;
    font-family:'Jost', sans-serif;
    font-size:0.95rem;
    color:#fff;
    letter-spacing:0.02em;
  }
  .step-value .unit{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:0.58rem;
    color: var(--silver-dim);
    margin-left:2px;
  }

  /* 右半分：常に見えている現在時刻／カウントダウン表示 */
  .timer-display{
    position:absolute;
    left:50%; top:0; bottom:0;
    width:50%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    padding: 0 16px;
    text-align:center;
  }
  .timer-display-label{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:0.58rem;
    letter-spacing:0.24em;
    color: var(--silver-dim);
    text-transform:uppercase;
  }
  .timer-display-value{
    font-family:'Kaisei Decol', serif;
    font-size:1.5rem;
    line-height:1.15;
    color:#fff;
    letter-spacing:0.02em;
    font-variant-numeric: tabular-nums;
  }
  .timer-display-value .unit{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:0.75rem;
    color: var(--silver-dim);
    margin-left:3px;
  }
  .timer-display-sub{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:0.56rem;
    letter-spacing:0.03em;
    color: var(--silver-dim);
  }
  .timer-display.finished{
    animation: timerFlash 0.6s ease 3;
  }
  @keyframes timerFlash{
    0%, 100%{ background: transparent; }
    50%{ background: rgba(200,168,90,0.18); }
  }

  /* タイマー動作中だけ現れる「止める」ボタン。押すと即座に時計表示へ戻る */
  .timer-stop-btn{
    position:absolute;
    top:8px;
    right:8px;
    width:22px; height:22px;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--silver-dim);
    color: var(--silver);
    font-size:0.5rem;
    line-height:1;
    cursor:pointer;
    z-index:5;
    transition: all .15s ease;
  }
  .timer-display.running .timer-stop-btn{
    display:flex;
  }
  .timer-stop-btn:active{
    background:#fff;
    color:#141414;
    border-color:#fff;
  }

  /* カバー本体：幅は半分固定。左端(設定を覆う)⇔右端(表示を覆う)の間をドラッグで往復する */
  .timer-cover{
    position:absolute;
    left:0; top:0; bottom:0;
    width:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(160deg, #232016, #141210 55%, #030302);
    border-right: 1px solid var(--hairline);
    cursor:grab;
    touch-action: pan-y; /* 縦スクロールは邪魔しない。横方向はJSでドラッグ検知 */
    user-select:none;
    transition: transform .28s cubic-bezier(.2,.8,.2,1);
  }
  .timer-cover.dragging{
    transition:none;
  }
  .timer-cover .grip{
    display:flex;
    gap:4px;
  }
  .timer-cover .grip span{
    width:3px; height:3px;
    border-radius:50%;
    background: var(--silver-dim);
    opacity:0.7;
  }

  .view-placeholder{
    width:100%;
    min-height: 240px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-align:center;
    color: var(--silver-dim);
  }
  .view-placeholder .icon{
    font-size:1.8rem;
    opacity:0.7;
    margin-bottom:4px;
  }
  .view-placeholder .title{
    font-family:'Kaisei Decol', serif;
    font-size:1rem;
    letter-spacing:0.06em;
    color:#fff;
  }
  .view-placeholder .desc{
    font-size:0.72rem;
    letter-spacing:0.04em;
    line-height:1.7;
    max-width:260px;
  }

  /* --- 下部ナビゲーションバー --- */
  .bottom-nav{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:600;
    display:flex;
    height: calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: linear-gradient(180deg, rgba(10,10,10,0.55), rgba(0,0,0,0.94) 45%);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--hairline);
  }
  .nav-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    border:none;
    padding:6px 4px;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-icon-img{
    height: 100%;
    max-height: 46px;
    width:auto;
    object-fit: contain;
    opacity:0.55;
    filter: grayscale(35%);
    transition: opacity .15s ease, filter .15s ease, transform .15s ease;
  }
  .nav-btn.active .nav-icon-img{
    opacity:1;
    filter: grayscale(0%);
    transform: translateY(-1px) scale(1.04);
  }


  .app-title{
    width:100%;
    text-align:center;
    margin-top:-24px;
  }
  h1{
    font-family:'Kaisei Decol', serif;
    font-weight:700;
    font-size: clamp(1.5rem, 6vw, 1.9rem);
    letter-spacing: 0.08em;
    margin:0;
    color:#fff;
    text-shadow: 0 2px 10px rgba(255,255,255,0.12);
  }
  .app-subtitle{
    margin:1px 0 0;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:0.72rem;
    letter-spacing:0.08em;
    color: var(--silver-dim);
  }

  /* ゲーム一覧の見出し（タイマーカードとの境目を示す） */
  .section-label{
    width:100%;
    padding: 0 4px;
    margin-top:-14px;
    margin-bottom:-20px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:0.68rem;
    font-weight:700;
    letter-spacing:0.18em;
    color: var(--silver-dim);
    text-transform:uppercase;
  }

  /* --- swipeable list: 全カードを1本の縦リストにして、なめらかに連続スクロール --- */
  .game-grid{
    --card-h: 90px;
    --card-gap: 10px;
    width:100%;
    height: calc(var(--card-h) * 4 + var(--card-gap) * 3);
    display:flex;
    flex-direction:column;
    gap: var(--card-gap);
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    touch-action: pan-y; /* このエリアだけ縦スワイプを許可 */
    padding: 2px 4px;
  }

  .game-grid::-webkit-scrollbar{
    display:none;
  }


  .game-card{
    position:relative;
    flex: 0 0 var(--card-h);
    height: var(--card-h);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:8px;
    padding: 12px 12px 10px;
    background: linear-gradient(160deg, #202020, #101010 55%, #030303);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    text-decoration:none;
    color:#fff;
    box-shadow: 0 6px 14px rgba(0,0,0,0.4);
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .game-card:hover{
    transform: translateY(-3px);
    border-color: var(--silver-dim);
    box-shadow: 0 10px 20px rgba(0,0,0,0.55);
  }
  .game-card .num{
    font-family:'Jost', sans-serif;
    font-weight:600;
    font-size:0.68rem;
    color: var(--silver-dim);
    letter-spacing:0.05em;
  }
  .game-card .title{
    font-family:'Kaisei Decol', serif;
    font-size: 0.92rem;
    letter-spacing: 0.03em;
    line-height:1.3;
  }
  .game-card .tags{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
  }
  .game-card .tag{
    font-size:0.56rem;
    letter-spacing:0.04em;
    color: var(--silver-dim);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 2px 7px;
  }
  .game-card .tag.cpu{ color:#dcd6c0; border-color: rgba(220,214,192,0.35); }
  .game-card .tag.master{ color:#fff; border-color: rgba(255,255,255,0.5); }



  footer{
    font-size:0.68rem;
    color: var(--silver-dim);
    letter-spacing:0.06em;
    text-align:center;
  }
#opening{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  background:#000;
  z-index:9999;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

#openingVideo{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* --- tap to start screen (OP動画の後に表示) --- */
#startScreen{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  background:#000;
  z-index:10000;
  display:none;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}
#startScreen .tap-text{
  font-family:'Kaisei Decol', serif;
  font-weight:500;
  color:#fff;
  font-size: clamp(0.9rem, 4.5vw, 1.15rem);
  letter-spacing:0.35em;
  text-transform:uppercase;
  animation: tapBlink 1.8s ease-in-out infinite;
  transform: translateY(-15vh);
}
@keyframes tapBlink{
  0%, 100%{ opacity:1; }
  50%{ opacity:0.2; }
}

  /* --- bonus tools（設定メニュー内、リンク一覧の下に配置） --- */
  .extras{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:28px;
    padding-top:24px;
    border-top:1px solid var(--hairline);
  }
  .extras-heading{
    font-size:0.62rem;
    letter-spacing:0.3em;
    color: var(--silver-dim);
    text-transform:uppercase;
    text-align:center;
    margin-bottom: 2px;
  }
  .icon-toggle-row{
    display:flex;
    gap:12px;
    justify-content:center;
  }
  .tool-toggle{
    display:flex;
    align-items:center;
    justify-content:center;
    width: 56px;
    height: 56px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    font-size:1.4rem;
    cursor:pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .tool-toggle:hover{ background: rgba(255,255,255,0.07); border-color: var(--silver-dim); }
  .tool-toggle.open{ background:#fff; border-color:#fff; }

  .tool-panel{
    width:100%;
    background: linear-gradient(160deg, #202020, #141414 45%, #030303);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 20px 18px;
    display:none;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .tool-panel.open{ display:flex; }

  .count-row{ display:flex; gap:8px; }
  .count-btn{
    width:36px; height:36px;
    border-radius:50%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--silver-dim);
    color: var(--silver);
    font-family:'Jost', sans-serif;
    font-weight:600;
    font-size:0.85rem;
    cursor:pointer;
    transition: all .15s ease;
  }
  .count-btn.active{ background:#fff; color:#141414; border-color:#fff; }

  .dice-row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; min-height:58px; }
  .die{
    width: 52px; height: 52px;
    background: linear-gradient(180deg, #ffffff, #cfc9b8);
    border-radius: 9px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.35), 0 6px 10px rgba(0,0,0,0.45), inset 0 2px 2px rgba(255,255,255,0.8);
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 7px;
  }
  .die.rolling{ animation: tumble 0.5s ease; }
  @keyframes tumble{
    0%{ transform: rotate(0deg) scale(1); }
    30%{ transform: rotate(120deg) scale(1.08); }
    60%{ transform: rotate(240deg) scale(0.94); }
    100%{ transform: rotate(360deg) scale(1); }
  }
  .pip{ width:7px; height:7px; border-radius:50%; background:#17130c; justify-self:center; align-self:center; opacity:0; }
  .pip.on{ opacity:1; }

  .dice-sum{ font-family:'Jost', sans-serif; font-size:0.78rem; color: var(--silver-dim); }
  .dice-sum b{ color:#fff; font-size:1rem; }

  .coin-wrap{ perspective: 600px; }
  .coin{
    width:84px; height:84px;
    border-radius:50%;
    position:relative;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.2,.8,.3,1);
  }
  .coin-face{
    position:absolute; inset:0;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Kaisei Decol', serif;
    font-weight:700;
    font-size:1.1rem;
    backface-visibility: hidden;
  }
  .coin-face.heads{
    background: linear-gradient(180deg, #ffffff, #cfc9b8);
    color:#141414;
    box-shadow: 0 4px 0 rgba(0,0,0,0.35), 0 8px 14px rgba(0,0,0,0.45), inset 0 2px 2px rgba(255,255,255,0.8);
  }
  .coin-face.tails{
    background: linear-gradient(180deg, #4a4a4a, #000000);
    color:#f2efe6;
    transform: rotateY(180deg);
    box-shadow: 0 4px 0 rgba(0,0,0,0.5), 0 8px 14px rgba(0,0,0,0.5), inset 0 0 0 1px #6f6f6f;
  }

  .coin-result{ font-size:0.8rem; color:#fff; letter-spacing:0.06em; min-height:1.2em; }

  .tool-btn{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:0.78rem;
    letter-spacing:0.1em;
    color:#fff;
    background: transparent;
    border: 1px solid var(--silver-dim);
    border-radius:2px;
    padding: 11px 26px;
    cursor:pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .tool-btn:hover{ background: rgba(255,255,255,0.06); border-color:#fff; }
  .tool-btn:active{ transform: translateY(1px); }
  header{
  position:relative;
  width:100%;
  height:32px;
  text-align:center;
}


.setting-btn{

  position:absolute;

  top:50%;
  transform: translateY(-50%);

  width:32px;
  height:32px;

  background:rgba(255,255,255,0.05);

  border:1px solid var(--hairline);

  border-radius:7px;

  color:#fff;

  font-size:1.05rem;

  cursor:pointer;

}
.setting-btn.gear-btn{
  right:0;
}
.setting-btn.menu-btn{
  left:0;
  font-size:0.95rem;
}
/* 設定パネル */

.setting-panel{

  position:fixed;

  top:0;
  right:-80%;

  width:80%;
  height:100%;

  background:rgba(10,10,10,0.65);

  backdrop-filter:blur(12px);

  z-index:999;

  padding:40px 25px;

  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  touch-action: pan-y; /* このパネルの中だけ縦スワイプ（スクロール）を許可 */

  transition:0.35s ease;

}

.setting-panel.open{

  right:0;

}

/* 左メニュー用：右からではなく左からスライドインする */
.setting-panel.menu-panel{
  left:-80%;
  right:auto;
}
.setting-panel.menu-panel.open{
  left:0;
  right:auto;
}


.setting-panel h2{

  margin:0;

  color:#fff;

  font-family:'Kaisei Decol', serif;

  font-size:1.5rem;

}

.setting-panel .close-btn{
  position:absolute;
  top:20px;
  right:20px;
  width:32px;
  height:32px;
  background:transparent;
  border:1px solid var(--hairline);
  border-radius:50%;
  color:#fff;
  font-size:1.1rem;
  line-height:1;
  cursor:pointer;
}

.setting-menu{
  display:flex;
  flex-direction:column;
  margin-top:28px;
  width:100%;
}
.setting-menu-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 4px;
  border-bottom:1px solid var(--hairline);
  color:#fff;
  text-decoration:none;
  font-family:'Zen Kaku Gothic New', sans-serif;
  font-size:0.82rem;
  letter-spacing:0.04em;
  transition: color .15s ease;
}
.setting-menu-item:hover{
  color: var(--silver-dim);
}
.setting-menu-item .arrow{
  color: var(--silver-dim);
  font-size:0.9rem;
}


</style>
</head>
<body>

<div id="opening">
  <video id="openingVideo" autoplay muted playsinline>
    <source src="opening.mp4" type="video/mp4">
  </video>
</div>

<div id="startScreen">
  <div class="tap-text">タップしてスタート</div>
</div>
  
<div class="app">
  
 <header>
  <button class="setting-btn menu-btn" id="menuBtn">☰</button>
  <button class="setting-btn gear-btn" id="gearBtn">⚙</button>

<script>
(function(){
  // ピンチズームの保険（Safari対策）
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  document.addEventListener('touchmove', e => {
    if(e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  const PIP_PATTERNS = {
    1: [5], 2: [1,9], 3: [1,5,9], 4: [1,3,7,9], 5: [1,3,5,7,9], 6: [1,3,4,6,7,9],
  };

  function setupToggle(toggleId, panelId, otherToggleId, otherPanelId){
    const toggle = document.getElementById(toggleId);
    const panel = document.getElementById(panelId);
    const otherToggle = document.getElementById(otherToggleId);
    const otherPanel = document.getElementById(otherPanelId);
    toggle.addEventListener('click', () => {
      const willOpen = !panel.classList.contains('open');
      panel.classList.toggle('open', willOpen);
      toggle.classList.toggle('open', willOpen);
      if(willOpen){
        otherPanel.classList.remove('open');
        otherToggle.classList.remove('open');
      }
    });
  }
  setupToggle('diceToggle', 'dicePanel', 'coinToggle', 'coinPanel');
  setupToggle('coinToggle', 'coinPanel', 'diceToggle', 'dicePanel');

  // --- dice roller ---
  let diceCount = 2;
  let diceRolling = false;

  function renderDiceCountButtons(){
    const row = document.getElementById('diceCountRow');
    row.innerHTML = '';
    for(let n=1; n<=5; n++){
      const btn = document.createElement('button');
      btn.className = 'count-btn' + (n === diceCount ? ' active' : '');
      btn.textContent = n;
      btn.addEventListener('click', () => {
        diceCount = n;
        renderDiceCountButtons();
        renderDiceFaces(Array(diceCount).fill(0));
      });
      row.appendChild(btn);
    }
  }

  function renderDiceFaces(values){
    const row = document.getElementById('diceRow');
    row.innerHTML = '';
    values.forEach(v => {
      const die = document.createElement('div');
      die.className = 'die';
      for(let i=1;i<=9;i++){
        const p = document.createElement('div');
        p.className = 'pip';
        if((PIP_PATTERNS[v] || []).includes(i)) p.classList.add('on');
        die.appendChild(p);
      }
      row.appendChild(die);
    });
    const sumEl = document.getElementById('diceSum');
    const total = values.reduce((a,b) => a+b, 0);
    sumEl.innerHTML = values.some(v => v > 0) ? ('合計 <b>' + total + '</b>') : '';
  }

  document.getElementById('diceRollBtn').addEventListener('click', () => {
    if(diceRolling) return;
    diceRolling = true;
    document.getElementById('diceRollBtn').disabled = true;

    let flickers = 0;
    const iv = setInterval(() => {
      const randomValues = Array.from({length:diceCount}, () => Math.floor(Math.random()*6)+1);
      renderDiceFaces(randomValues);
      document.querySelectorAll('#diceRow .die').forEach(d => {
        d.classList.remove('rolling'); void d.offsetWidth; d.classList.add('rolling');
      });
      flickers++;
      if(flickers > 5){
        clearInterval(iv);
        diceRolling = false;
        document.getElementById('diceRollBtn').disabled = false;
      }
    }, 90);
  });

  renderDiceCountButtons();
  renderDiceFaces(Array(diceCount).fill(0));

  // --- coin flip ---
  let coinFlipping = false;
  let coinRotation = 0;

  document.getElementById('coinFlipBtn').addEventListener('click', () => {
    if(coinFlipping) return;
    coinFlipping = true;
    document.getElementById('coinFlipBtn').disabled = true;
    document.getElementById('coinResult').textContent = '';

    const isHeads = Math.random() < 0.5;
    const extraSpins = 4;
    coinRotation += extraSpins * 360 + (isHeads ? 0 : 180);
    const coin = document.getElementById('coin');
    coin.style.transform = 'rotateY(' + coinRotation + 'deg)';

    setTimeout(() => {
      document.getElementById('coinResult').textContent = isHeads ? '表が出ました' : '裏が出ました';
      coinFlipping = false;
      document.getElementById('coinFlipBtn').disabled = false;
    }, 1000);
});

  // --- ゲーム一覧データ（縦=1ページ6枚でページ送り／横=全カードを1本の帯で横スクロール） ---
  const GAMES = [
    { num:'01', title:'ミニ将棋', href:'mini_shogi.html', tags:[{t:'2人'},{t:'CPU',c:'cpu'},{t:'達人',c:'master'}] },
    { num:'02', title:'コネクトフォー', href:'connect_four.html', tags:[{t:'2人'},{t:'CPU',c:'cpu'},{t:'達人',c:'master'}] },
    { num:'03', title:'神経衰弱', href:'memory_match.html', tags:[{t:'2人'},{t:'CPU',c:'cpu'}] },
    { num:'04', title:'ヒット＆ブロー', href:'hit_and_blow.html', tags:[{t:'2人'},{t:'CPU',c:'cpu'},{t:'達人',c:'master'}] },
    { num:'05', title:'ドット＆ボックス', href:'dots_and_boxes.html', tags:[{t:'2人'}] },
    { num:'06', title:'五目並べ', href:'gomoku.html', tags:[{t:'2人'},{t:'CPU',c:'cpu'},{t:'達人',c:'master'}] },
    { num:'07', title:'積み木カウント', href:'counting_duel.html', tags:[{t:'2人'}] },
    { num:'08', title:'ダイス21', href:'dice21.html', tags:[{t:'2人'},{t:'CPU',c:'cpu'}] },
    { num:'09', title:'ダウト', href:'doubt_game.html', tags:[{t:'2人'},{t:'CPU',c:'cpu'}] },
    { num:'10', title:'ブラックジャック', href:'blackjack.html', tags:[{t:'ディーラー戦',c:'cpu'}] },
    { num:'11', title:'2人人狼', href:'werewolf2.html', tags:[{t:'2人'}] },
  ];

  const gameGrid = document.getElementById('gameGrid');

  function buildCardEl(game){
    const a = document.createElement('a');
    a.className = 'game-card';
    a.href = game.href;

    const info = document.createElement('div');
    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = game.num;
    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = game.title;
    info.appendChild(num);
    info.appendChild(title);

    const tagsWrap = document.createElement('div');
    tagsWrap.className = 'tags';
    game.tags.forEach(tag => {
      const span = document.createElement('span');
      span.className = 'tag' + (tag.c ? ' ' + tag.c : '');
      span.textContent = tag.t;
      tagsWrap.appendChild(span);
    });

    a.appendChild(info);
    a.appendChild(tagsWrap);
    return a;
  }

  function renderGamePages(){
    gameGrid.innerHTML = '';
    // ページ分けはせず、全カードを1本の縦リストとして並べる（引っかかりのない連続スクロール）
    GAMES.forEach(game => {
      gameGrid.appendChild(buildCardEl(game));
    });
    gameGrid.scrollTop = 0;
  }

  renderGamePages();


    const opening = document.getElementById("opening");
  const openingVideo = document.getElementById("openingVideo");
  const startScreen = document.getElementById("startScreen");
  const app = document.querySelector(".app");

  if(sessionStorage.getItem("hitotokiStarted")){

  opening.style.display = "none";
  startScreen.style.display = "none";
  app.style.display = "flex";

}
  
 function showStartScreen(){
  sessionStorage.setItem("hitotokiStarted", "true");

  opening.style.display = "none";
  startScreen.style.display = "flex";
}

  openingVideo.addEventListener("ended", showStartScreen);

  opening.addEventListener("click", () => {
    openingVideo.pause();
    showStartScreen();
  });

  startScreen.addEventListener("click", () => {
    startScreen.style.display = "none";
    app.style.display = "flex";
  });
// 設定パネル（⚙：右からスライドイン。プライバシーポリシー等＋おまけ機能）
const gearBtn = document.getElementById("gearBtn");
  const closeBtn = document.getElementById("closeBtn");
const settingPanel = document.getElementById("settingPanel");


gearBtn.addEventListener("click",()=>{

  settingPanel.classList.toggle("open");

});
closeBtn.addEventListener("click",()=>{

  settingPanel.classList.remove("open");

});  

// メニューパネル（☰：左からスライドイン。中身は未定のプレースホルダー）
const menuBtn = document.getElementById("menuBtn");
const menuCloseBtn = document.getElementById("menuCloseBtn");
const menuPanel = document.getElementById("menuPanel");

menuBtn.addEventListener("click",()=>{
  menuPanel.classList.toggle("open");
});
menuCloseBtn.addEventListener("click",()=>{
  menuPanel.classList.remove("open");
});

// --- 下部ナビ：ホーム／記録／コレクションの画面切り替え ---
const navButtons = document.querySelectorAll('.nav-btn');
const views = document.querySelectorAll('.view-content');

function switchView(viewId){
  views.forEach(v => { v.style.display = (v.id === viewId) ? 'flex' : 'none'; });
  navButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.view === viewId));
  if(viewId === 'homeView'){
    // ホームに戻ったときはページ位置を再計算しておく（回転などでズレる場合があるため）
    renderGamePages();
  }
}

navButtons.forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.dataset.view));
});

// --- タイマー：発車標風。カードは左右半分に分かれていて、右半分は常に
//     「現在の設定／カウントダウン」を表示。左半分の設定画面（プリセット・±）は
//     普段カバーで隠れていて、カバーを右へスライドすると現れる。
//     カバーを左（元の位置＝設定側を覆う）に戻すと、その瞬間にタイマーがスタートする。
//     動作中にもう一度右へスライドするとキャンセルして編集モードに戻る。 ---
// --- タイマー：発車標風。カードは左右半分に分かれていて、右半分は常に見えるエリア。
//     触っていない時は現在時刻の時計として動作し、左半分の設定画面（プリセット・±）は
//     普段カバーで隠れていて、カバーを右へスライドすると現れる。
//     カバーを左（元の位置＝設定側を覆う）に戻すと、その瞬間にタイマーがスタートする。
//     動作中は右上に「止める」ボタンが現れ、押すと即座に時計表示へ戻る。
//     また、動作中にもう一度右へスライドしてもキャンセルして編集モードに戻る。 ---
(function initTimer(){
  const card = document.getElementById('timerCard');
  const cover = document.getElementById('timerCover');
  const label = document.getElementById('timerDisplayLabel');
  const valueEl = document.getElementById('timerDisplayValue');
  const subEl = document.getElementById('timerDisplaySub');
  const displayEl = document.getElementById('timerDisplay');
  const stopBtn = document.getElementById('timerStopBtn');
  const presetsWrap = document.getElementById('timerPresets');
  const stepValueEl = document.getElementById('timerStepValue');
  const stepMinusBtn = document.getElementById('timerStepMinus');
  const stepPlusBtn = document.getElementById('timerStepPlus');
  const resetBtn = document.getElementById('timerResetBtn');
  if(!card || !cover) return;

  const MIN_MINUTES = 0;
  const MAX_MINUTES = 60;
  let selectedMinutes = 0;    // 現在設定されている時間（プリセットは押すたびに加算していく）
  let remainingSeconds = 0;   // カウントダウン中の残り秒数
  // 'clock'（触っていない時＝時計として動作） | 'open'（カバーが開いて設定編集中） | 'running'（カウントダウン中） | 'finished'（0になった直後の演出中）
  let state = 'clock';

  let dragStartX = 0;
  let dragOffset = 0;
  let maxOffset = 0;
  let dragging = false;
  let stateAtDragStart = 'clock';
  let isOpenPos = false; // カバーが今「右（表示側を覆う位置）」にあるか

  function setState(next){
    state = next;
    displayEl.classList.toggle('running', state === 'running');
  }

  function calcMaxOffset(){
    // カバー幅ぶん（＝カード幅の半分）だけ右へ動かせば、ちょうど反対側を覆う
    maxOffset = Math.max(0, card.clientWidth - cover.getBoundingClientRect().width);
  }

  function setCoverX(px){
    cover.style.transform = `translateX(${px}px)`;
  }

  function formatClock(){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    label.style.display = 'none';
    valueEl.innerHTML = `${hh}:${mm}`;
    subEl.textContent = 'スライドしてタイマー設定';
  }

  function formatRunning(){
    label.style.display = '';
    label.textContent = 'NEXT STOP';
    const m = Math.floor(remainingSeconds / 60);
    const s = remainingSeconds % 60;
    valueEl.innerHTML = `${m}:${String(s).padStart(2,'0')}`;
    subEl.textContent = 'スライドで中止';
  }

  function formatFinished(){
    label.style.display = '';
    label.textContent = 'ARRIVED';
    valueEl.innerHTML = `0:00`;
    subEl.textContent = 'まもなく時計表示に戻ります';
  }

  function updateStepValue(){
    stepValueEl.innerHTML = `${selectedMinutes}<span class="unit">分</span>`;
  }

  function setSelectedMinutes(min){
    selectedMinutes = Math.min(MAX_MINUTES, Math.max(MIN_MINUTES, min));
    updateStepValue();
  }

  function startTimer(){
    remainingSeconds = selectedMinutes * 60;
    displayEl.classList.remove('finished');
    setState('running');
    formatRunning();
  }

  // 「止める」ボタン：動作中のタイマーを即座に打ち切って時計表示に戻す
  function stopManually(){
    if(state !== 'running') return;
    displayEl.classList.remove('finished');
    setState('clock');
    formatClock();
  }

  // カバーを開いてのキャンセル：設定編集モードに戻る（時計には戻らない）
  function cancelTimer(){
    displayEl.classList.remove('finished');
    setState('open');
  }

  // 1秒ごとのティック。今の状態に応じて「時計を進める」か「カウントダウンする」かだけを行う
  setInterval(() => {
    if(state === 'running'){
      remainingSeconds--;
      if(remainingSeconds <= 0){
        setState('finished');
        displayEl.classList.add('finished');
        formatFinished();
        if(navigator.vibrate){ navigator.vibrate([200,100,200,100,200]); }
        // 少し余韻を置いてから、時計表示に戻す
        setTimeout(() => {
          displayEl.classList.remove('finished');
          setState('clock');
          formatClock();
        }, 2400);
        return;
      }
      formatRunning();
    } else if(state === 'clock'){
      formatClock();
    }
    // 'open' と 'finished' の間は何もしない（'open' は隠れていて見えず、'finished' は演出中のため）
  }, 1000);

  stopBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    stopManually();
  });

  // --- ドラッグ操作 ---
  function onPointerDown(e){
    calcMaxOffset();
    dragging = true;
    stateAtDragStart = state;
    dragStartX = (e.touches ? e.touches[0].clientX : e.clientX);
    dragOffset = isOpenPos ? maxOffset : 0;
    cover.classList.add('dragging');
    cover.setPointerCapture && e.pointerId != null && cover.setPointerCapture(e.pointerId);
  }

  function onPointerMove(e){
    if(!dragging) return;
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    const delta = x - dragStartX;
    let next = (isOpenPos ? maxOffset : 0) + delta;
    next = Math.min(maxOffset, Math.max(0, next));
    dragOffset = next;
    setCoverX(next);
  }

  function onPointerUp(){
    if(!dragging) return;
    dragging = false;
    cover.classList.remove('dragging');

    const movedToOpenSide = dragOffset > maxOffset * 0.5;

    if(movedToOpenSide){
      // カバーが右（表示側）へ → 設定側が開いて編集できる状態。動いていたタイマーはキャンセル
      setCoverX(maxOffset);
      isOpenPos = true;
      if(stateAtDragStart === 'running'){
        cancelTimer();
      } else {
        setState('open');
      }
    } else {
      // カバーが左（設定側）へ戻った
      setCoverX(0);
      isOpenPos = false;
      if(stateAtDragStart === 'open'){
        // 「開」→「閉」に戻した瞬間だけスタートする（0分のままなら何もせず時計に戻る）
        if(selectedMinutes > 0){
          startTimer();
        } else {
          setState('clock');
          formatClock();
        }
      }
      // それ以外（もともと閉じていた／動作中だった）は何もしない
    }
  }

  cover.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  // 一部ブラウザ向けのタッチイベントフォールバック
  cover.addEventListener('touchstart', onPointerDown, { passive:true });
  window.addEventListener('touchmove', onPointerMove, { passive:true });
  window.addEventListener('touchend', onPointerUp);

  window.addEventListener('resize', () => {
    calcMaxOffset();
    if(isOpenPos) setCoverX(maxOffset);
  });

  // プリセットは押すたびに現在値へ加算する（5分→10分→15分…と積み上げていく）
  presetsWrap.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => setSelectedMinutes(selectedMinutes + Number(btn.dataset.min)));
  });
  stepMinusBtn.addEventListener('click', () => setSelectedMinutes(selectedMinutes - 1));
  stepPlusBtn.addEventListener('click', () => setSelectedMinutes(selectedMinutes + 1));
  resetBtn.addEventListener('click', () => setSelectedMinutes(0));

  calcMaxOffset();
  updateStepValue();
  formatClock();
})();

})();
</script>
